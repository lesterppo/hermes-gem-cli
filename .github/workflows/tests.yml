name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The suite stubs the network (gemini_webapi is imported lazily inside
      # functions) and the cookie stores, so nothing else is needed here.
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Compile check
        run: python -m py_compile gemini.py gem-cli.py gemini-win.py

      - name: Unit tests (offline)
        run: python -m pytest tests/ -q
